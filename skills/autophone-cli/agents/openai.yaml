interface:
  display_name: "Autophone CLI"
  short_description: "Operate Android devices through autophone-cli."
  default_prompt: "Use $autophone-cli to list adb devices and Android users, inspect current user, target facts, read Android storage capacity, locale sources, animation scales, and accessibility settings, read or set display orientation policy, open/collapse notification or quick settings panels, inspect SystemUI status bar icon slots, read AudioManager stream volume indexes and ringer/zen state, ensure readiness, discover packages, inspect exact package presence and App Links state, install one local APK, uninstall one confirmed package, inspect/grant/revoke one runtime permission, stat or hash one device path, create one device directory, copy one regular device file, move one confirmed device file or symlink, launch/stop/reset apps, resolve or open http(s) URLs, read bounded package log diagnostics, observe UI, scroll safely, scroll until selectors are visible, drag between safe selector-derived targets, capture screenshots or bounded screenrecord videos, find candidates, clear focused text fields, type safe ASCII or clipboard-backed UTF-8 text, read/write clipboard metadata safely, send safe keys, wait for conditions, run bounded recipes, attach opt-in proof manifests, and tap, double-tap, or long-press verified targets."
